          var msg1 = 'Vous avez coché ou annoté des corrections. Décochez-les et effacez les annotations pour répondre qu’aucune correction n’est à faire, ou utilisez « Envoyer à Claude ».';
          if (c) { cases[c].focus(); return msg1; }
          if (a) { annots[a].input.focus(); return msg1; }
          if (nettoyer(etat.obs)) { obs.input.focus(); return 'Vous avez écrit des observations. Effacez-les pour répondre qu’aucune correction n’est à faire, ou utilisez « Envoyer à Claude ».'; }
          return null;
        }
      }
    };
  }

  /* découpage en lots de 4 000 octets au plus */
  function decouper(items, fabriquer, libelleLot, nomItem) {
    var lots = [], cur = [], i, it;
    for (i = 0; i < items.length; i += 1) {
      it = items[i];
      if (octets(fabriquer([it])) > MAX_OCTETS) return { trop: nomItem(it), octets: octets(fabriquer([it])) };
      if (cur.length && (cur.length >= MAX_ELEM || octets(fabriquer(cur.concat([it]))) > MAX_OCTETS)) { lots.push(cur); cur = []; }
      cur.push(it);
    }
    if (cur.length) lots.push(cur);
    return { lots: lots.map(function (l) { return { libelle: libelleLot(l), charge: fabriquer(l) }; }) };
  }

  /* ---------- construction d'un écran de saisie ---------- */
  function construireSaisie(onglet) {
    var etat = etatPour(onglet), type = onglet.saisie.type, ctx, ecran, racine, zResume, zStatut, zBoutons, zLots, zTaille, zNoteLots, zAnnonce, zCopie, zEnvoye, zRestaure, zStockage, annonceFaite = false, noteLotsAnnoncee = false, occupe = false, elements = [];
    racine = h('section', { class: 'saisie', 'aria-labelledby': uid('h') });
    var titre = h('h3', { id: racine.getAttribute('aria-labelledby'), tabindex: '-1', text: 'Votre saisie' });
    zRestaure = h('p', { role: 'status', class: 'note', hidden: !etat.restaure, text: 'Votre saisie précédente a été rétablie.' });
    zStockage = h('p', { class: 'note avert-stockage', hidden: stockageOK, text: 'Votre saisie n’est pas conservée si la page se recharge : envoyez-la avant que Claude ne mette l’artefact à jour.' });
    zEnvoye = h('p', { class: 'envoye', hidden: !etat.envoye, text: etat.envoye ? 'Envoyé à ' + etat.envoye : '' });
    zResume = h('div');
    zStatut = h('div', { class: 'statut', role: 'status', 'aria-live': 'polite' });
    zBoutons = h('div', { class: 'btns' });
    zLots = h('div', { class: 'lots' });
    zCopie = h('div');
    zTaille = h('p', { class: 'compteur', 'aria-hidden': 'true' });
    zNoteLots = h('p', { class: 'note', hidden: true });
    zAnnonce = h('p', { class: 'sr', role: 'status' });
    ctx = {
      modeLots: false,
      titre: titre,
      dire: function (t) { zStatut.textContent = t; },
      change: function () {
        etat.restaure = false; zRestaure.hidden = true;
        zStatut.textContent = ''; zLots.textContent = ''; zCopie.textContent = '';
        sauverBrouillon(onglet, etat);
        if (ecran.majLots) ecran.majLots(); else ctx.majTaille();
      },
      majTaille: function () {
        var n, a;
        if (!ecran.compteur) return;
        a = ecran.approx();
        n = octets(enveloppe(onglet, a));
        zTaille.textContent = 'Taille de l’envoi : ' + nombre(n) + ' sur ' + nombre(MAX_OCTETS) + ' octets';
        zTaille.classList.toggle('alerte', n > MAX_OCTETS * 0.8);
        if (n > MAX_OCTETS * 0.8 && !annonceFaite) { annonceFaite = true; zAnnonce.textContent = 'Attention : votre saisie approche de la limite de ' + nombre(MAX_OCTETS) + ' octets pour un seul envoi.'; }
        if (n <= MAX_OCTETS * 0.8) { annonceFaite = false; zAnnonce.textContent = ''; }
      },
      majResume: function () {
        if (!zResume.firstChild) return;
        var reste = elements.some(function (e) { return e.ctrl && e.ctrl._slot && !e.ctrl._slot.hidden; });
        if (!reste) zResume.textContent = '';
      }
    };
    ecran = type === 'fiche' ? ecranFiche(onglet, etat, ctx) : type === 'validation_cadrage' ? ecranCadrage(onglet, etat, ctx) : type === 'points_decision' ? ecranDecision(onglet, etat, ctx) : type === 'selection_robustesse' ? ecranRobustesse(onglet, etat, ctx) : ecranJugement(onglet, etat, ctx);

    function libelleErreur(e) {
      if (e.lib) return e.lib;
      var c = e.ctrl, l = c.id && (c.tagName === 'TEXTAREA' || c.type === 'text') ? $('label[for="' + c.id + '"]', racine) : null;
      return l ? (e.msg.indexOf(' : ') >= 0 ? l.textContent + ', ' + e.msg.charAt(0).toLowerCase() + e.msg.slice(1) : l.textContent + ' : ' + e.msg) : e.msg;
    }
    function valider() {
      var r = ecran.collecter(), liste, ul, premier;
      zResume.textContent = ''; zStatut.textContent = ''; zLots.textContent = ''; zCopie.textContent = '';
      elements.forEach(function (e) { if (e.ctrl) retirerErreur(e.ctrl); });
      elements = [];
      if (!r.erreurs.length) return r;
      liste = r.erreurs.filter(function (e) { return e.ctrl; });
      elements = liste;
      liste.forEach(function (e) { poserErreur(e.ctrl, e.msg); });
      ul = h('ul');
      liste.forEach(function (e) {
        ul.appendChild(h('li', {}, [h('a', { href: '#', text: libelleErreur(e), onclick: function (ev) { ev.preventDefault(); e.ctrl.focus(); } })]));
      });
      var resumeTxt = r.erreurs.filter(function (e) { return e.resume; })[0];
      zResume.appendChild(h('div', { class: 'resume', role: 'alert' }, [h('p', { text: 'Votre saisie n’est pas complète. À corriger :' }), resumeTxt ? h('p', { text: resumeTxt.resume }) : null, ul]));
      premier = liste[0] && liste[0].ctrl;
      if (premier) { try { premier.scrollIntoView({ block: 'center' }); } catch (e) { /* ignoré */ } premier.focus({ preventScroll: true }); }
      return null;
    }
    function lancer(charge, apres, aucunReste) {
      var mode, p, n;
      if (occupe) return;
      if (D.demo === true) { zStatut.textContent = 'Mode démonstration : rien n’est envoyé.'; return; }
      n = octets(charge);
      if (n > MAX_OCTETS) { zStatut.textContent = 'Cette saisie est trop longue pour un seul envoi (' + nombre(n) + ' octets, limite ' + nombre(MAX_OCTETS) + ').'; return; }
      if (tropDElements(charge)) { zStatut.textContent = 'Cette saisie compte trop d’éléments pour un seul envoi (' + MAX_ELEM + ' au plus). Utilisez « Copier pour Claude ».'; return; }
      mode = modeEnvoi();
      occupe = true;
      majOccupe(true);
      zStatut.textContent = '';
      try { p = room.sendToClaudeSession(charge, { deliver: mode }); } catch (e) { p = Promise.reject(e); }
      Promise.resolve(p).then(function () {
        occupe = false;
        etat.envoye = heure();
        zEnvoye.textContent = 'Envoyé à ' + etat.envoye; zEnvoye.hidden = false;
        zStatut.textContent = mode === 'stage' ? 'Votre saisie est déposée dans la zone de message de la conversation. Appuyez sur Entrée pour l’envoyer.' : 'Envoyé. Regardez la conversation : confirmez l’envoi dans la fenêtre de Claude si elle s’affiche.';
        if (apres) apres(); else effacer(cleBrouillon(onglet.id));
        if (!apres) { /* envoi complet : brouillon effacé */ }
        majOccupe(false);
      }, function (e) {
        var code = codeErreur(e);
        occupe = false;
        if (code === 'rate_limited') zStatut.textContent = 'Trop d’envois rapprochés. Patientez quelques secondes, puis réessayez.';
        else if (code === 'upstream_error') zStatut.textContent = 'Le service de Claude a répondu par une erreur. Réessayez, ou utilisez « Copier pour Claude ».';
        else if (code === 'invalid_argument') zStatut.textContent = 'L’envoi a été refusé : la saisie n’a pas le format attendu. Utilisez « Copier pour Claude ».';
        else {
          zStatut.textContent = 'Claude n’est pas joignable depuis cette page pour le moment. Votre saisie est conservée. Utilisez « Copier pour Claude », puis collez dans la conversation.';
          verifierStatut().then(function (s) {
            statutRoom = s;
            if (s === 'available' && mode === 'send') {
              try { Promise.resolve(room.sendToClaudeSession(charge, { deliver: 'stage' })).then(function () {
                zStatut.textContent = 'Votre saisie est déposée dans la zone de message de la conversation. Appuyez sur Entrée pour l’envoyer.';
                etat.envoye = heure(); zEnvoye.textContent = 'Envoyé à ' + etat.envoye; zEnvoye.hidden = false;
                if (apres) apres(); else effacer(cleBrouillon(onglet.id));
              }, function () { /* message déjà affiché */ }); } catch (e2) { /* message déjà affiché */ }
            }
            ctx.boutons();
          });
        }
        majOccupe(false);
      });
    }
    ctx.lancer = lancer;
    function majOccupe(oui) {
      Array.prototype.forEach.call(racine.querySelectorAll('.btn'), function (b) { if (oui || b._clos) b.setAttribute('disabled', ''); else b.removeAttribute('disabled'); });
      var env = $('.btn-envoi', racine);
      if (env) { env.setAttribute('aria-busy', oui ? 'true' : 'false'); env.textContent = oui ? 'Envoi en cours…' : env._texte; }
    }
    function clicEnvoi() {
      var r = valider(), charge, n, lots;
      if (!r) return;
      charge = enveloppe(onglet, r.valeurs);
      if (D.demo === true) { zStatut.textContent = 'Mode démonstration : rien n’est envoyé.'; return; }
      n = octets(charge);
      if (n > MAX_OCTETS || tropDElements(charge)) {
        lots = ecran.lots ? ecran.lots(r.valeurs) : null;
        if (lots && lots.lots) {
          zStatut.textContent = (n > MAX_OCTETS ? 'Cette saisie est trop longue pour un seul envoi (' + nombre(n) + ' octets, limite ' + nombre(MAX_OCTETS) + ').' : 'Cette saisie compte trop d’éléments pour un seul envoi (' + MAX_ELEM + ' au plus).') + ' Envoyez-la en plusieurs lots avec les boutons ci-dessous, ou utilisez « Copier pour Claude ».';
          var restants = lots.lots.length;
          lots.lots.forEach(function (l) {
            zLots.appendChild(h('button', { type: 'button', class: 'btn', text: l.libelle, onclick: function (ev) {
              var b = ev.currentTarget;
              lancer(l.charge, function () { restants -= 1; b._clos = true; b.setAttribute('disabled', ''); b.textContent = 'Lot envoyé : ' + l.libelle; if (restants <= 0) effacer(cleBrouillon(onglet.id)); });
            } }));
          });
        } else if (lots && lots.trop) {
          zStatut.textContent = lots.f ? lots.trop + ' est trop longue pour un envoi (' + nombre(lots.octets) + ' octets, limite ' + nombre(MAX_OCTETS) + '). Raccourcissez-la, ou utilisez « Copier pour Claude ».' : lots.trop + ' est trop long pour un envoi (' + nombre(lots.octets) + ' octets, limite ' + nombre(MAX_OCTETS) + '). Raccourcissez-le, ou utilisez « Copier pour Claude ».';
        } else {
          zStatut.textContent = 'Cette saisie est trop longue pour un seul envoi (' + nombre(n) + ' octets, limite ' + nombre(MAX_OCTETS) + '). Raccourcissez vos textes d’environ ' + nombre(Math.ceil((n - MAX_OCTETS) / 1.1)) + ' caractères, ou utilisez « Copier pour Claude ».';
        }
        return;
      }
      lancer(charge);
    }
    function copier(valeurs) {
      var txt = JSON.stringify(enveloppe(onglet, valeurs), null, 2), p;
      zCopie.textContent = '';
      try { p = navigator.clipboard.writeText(txt); } catch (e) { p = Promise.reject(e); }
      Promise.resolve(p).then(function () {
        zStatut.textContent = 'Copié. Collez maintenant dans la conversation (Ctrl+V, ou Cmd+V sur Mac), puis envoyez.';
      }, function () {
        var ta = h('textarea', { class: 'copie-repli', readonly: true, 'aria-label': 'Texte à copier' });
        ta.value = txt;
        zStatut.textContent = 'La copie automatique n’a pas fonctionné. Le texte est sélectionné ci-dessous : copiez-le (Ctrl+C, ou Cmd+C sur Mac), puis collez-le dans la conversation.';
        zCopie.appendChild(ta);
        ta.focus(); ta.select();
      });
    }
    function clicCopie() { var r = valider(); if (r) copier(r.valeurs); }
    ctx.boutons = function () {
      var envoi = peutEnvoyer() && !ctx.modeLots, lib = statutRoom === 'available_if_opened' ? 'Déposer dans la conversation' : 'Envoyer à Claude', b;
      zBoutons.textContent = '';
      if (ecran.sansBoutons) return;
      if (!peutEnvoyer()) zBoutons.appendChild(h('p', { class: 'note aide-envoi', text: 'L’envoi direct n’est possible que lorsque cette page est ouverte à côté de la conversation avec Claude. Ici, utilisez « Copier pour Claude », puis collez dans la conversation.' }));
      if (envoi) {
        b = h('button', { type: 'button', class: 'btn primaire btn-envoi', text: lib, onclick: clicEnvoi });
        b._texte = lib;
        zBoutons.appendChild(b);
      }
      zBoutons.appendChild(h('button', { type: 'button', class: 'btn' + (envoi || ctx.modeLots ? '' : ' primaire'), text: 'Copier pour Claude', onclick: clicCopie }));
      if (ecran.tertiaire) zBoutons.appendChild(h('button', { type: 'button', class: 'btn tertiaire', text: ecran.tertiaire.texte, onclick: function () {
        var msg = ecran.tertiaire.bloque ? ecran.tertiaire.bloque() : null;
        zResume.textContent = '';
        if (msg) { zStatut.textContent = msg; return; }

      } }));
      if (ctx.modeLots && peutEnvoyer()) {
        zNoteLots.textContent = 'Vos corrections dépassent la taille d’un seul envoi (' + nombre(octets(enveloppe(onglet, ecran.approx()))) + ' sur ' + nombre(MAX_OCTETS) + ' octets). Envoyez-les partie par partie avec les boutons « Envoyer cette partie » ci-dessous.';
        zNoteLots.hidden = false;
        if (!noteLotsAnnoncee) { noteLotsAnnoncee = true; zAnnonce.textContent = 'Envoi en plusieurs parties nécessaire : envoyez vos corrections partie par partie.'; }
      } else { zNoteLots.hidden = true; noteLotsAnnoncee = false; }
    };
    [titre, zRestaure, zStockage, zEnvoye, zResume, ecran.corps, zTaille, zNoteLots, zAnnonce, zBoutons, zStatut, zLots, zCopie].forEach(function (n) { racine.appendChild(n); });
    ctx.racine = racine;
    ctxCourant = ctx;
    if (ecran.majLots) ecran.majLots(); else { ctx.majTaille(); ctx.boutons(); }
    return racine;
  }

  /* ---------- synthèse des points de décision (générée par la page) ---------- */
  function syntheseDecision(points) {
    var t = h('table'), tb = h('tbody');
    t.appendChild(h('caption', { text: 'Synthèse des points de décision' }));
    t.appendChild(h('thead', {}, [h('tr', {}, ['N°', 'Question', 'Options', 'Indicateur', 'Proposition de l’IA'].map(function (x) { return h('th', { scope: 'col', text: x }); }))]));
    points.forEach(function (p) {
      var opts = (p.options || []).map(function (o) { return o.code + '. ' + o.libelle; }).join(' ; ');
      tb.appendChild(h('tr', {}, [h('td', { text: String(p.id) }), h('td', { text: String(p.intitule) }), h('td', { text: opts }), h('td', {}, [pastille(p.indicateur)]), h('td', { text: p.prop_ia === 'ABSTENTION' ? 'Abstention' : p.prop_ia ? 'Option ' + p.prop_ia : '' })]));
    });
    t.appendChild(tb);
    return h('div', { class: 'tableau', role: 'region', tabindex: '0', 'aria-label': 'Tableau, défilement horizontal' }, [t]);
  }

  /* ---------- onglets ---------- */
  var visibles = [], actif = null;
  var TYPES = ['fiche', 'validation_cadrage', 'points_decision', 'corrections_jugement', 'selection_robustesse'];
  function saisieValide(o) { return o && o.saisie && typeof o.saisie === 'object' && TYPES.indexOf(o.saisie.type) >= 0; }
  function iconeStatut(s) { return s === 'fait' ? 'coche' : s === 'en_cours' ? 'demi' : 'cercle'; }
  function dessinerBarre() {
    var barre = $('#mg-barre');
    barre.textContent = '';
    visibles.forEach(function (o, i) {
      var etat = STATUTS[o.statut], b = h('button', { type: 'button', class: 'onglet', role: 'tab', id: 'onglet-' + idSur(o.id), 'aria-controls': 'mg-panneau', 'aria-selected': o === actif ? 'true' : 'false', tabindex: o === actif ? '0' : '-1' }, [
        h('span', { class: 'titre', text: String(o.titre || o.id) }),
        etat ? h('span', { class: 'etat ' + String(o.statut).replace('_', '-') }, [icone(iconeStatut(o.statut)), etat]) : null
      ]);
      b.addEventListener('click', function () { choisir(o, false); });
      b.addEventListener('keydown', function (ev) {
        var n = visibles.length, k = ev.key, j = -1;
        if (k === 'ArrowRight') j = (i + 1) % n;
        else if (k === 'ArrowLeft') j = (i - 1 + n) % n;
        else if (k === 'Home') j = 0;
        else if (k === 'End') j = n - 1;
        if (j >= 0) { ev.preventDefault(); choisir(visibles[j], true); }
      });
      barre.appendChild(b);
    });
    var bas = $('#mg-barre-bas');
    bas.textContent = '';
    visibles.forEach(function (o) {
      var etat = STATUTS[o.statut], b = h('button', { type: 'button', class: 'onglet', 'aria-current': o === actif ? 'true' : null }, [
        h('span', { class: 'titre', text: String(o.titre || o.id) }),
        etat ? h('span', { class: 'etat ' + String(o.statut).replace('_', '-') }, [icone(iconeStatut(o.statut)), etat]) : null
      ]);
      b.addEventListener('click', function () {
        choisir(o, false);
        var t = document.getElementById('mg-titre');
        if (t) t.focus();
      });
      bas.appendChild(b);
    });
    var ba = bas.querySelector('[aria-current]');
    if (ba) { try { bas.scrollLeft = Math.max(0, ba.offsetLeft - (bas.clientWidth - ba.offsetWidth) / 2); } catch (e) { /* ignoré */ } }
  }
  function choisir(o, focus) {
    actif = o;
    dessinerBarre();
    var b = document.getElementById('onglet-' + idSur(o.id));
    if (focus && b) b.focus();
    if (b && b.scrollIntoView) { try { b.scrollIntoView({ inline: 'center', block: 'nearest' }); } catch (e) { /* ignoré */ } }
    afficher(o);
    rafraichirStatut();
  }
  function afficher(o) {
    var p = $('#mg-panneau'), titre = h('h2', { id: 'mg-titre', text: String(o.titre || o.id), tabindex: '-1' }), lecture = null, saisie = null, md, avecLecture, pts;
    p.textContent = '';
    p.setAttribute('aria-labelledby', 'onglet-' + idSur(o.id));
    ctxCourant = null;
    p.appendChild(titre);
    if (o.id === 'definitif') p.appendChild(h('p', { class: 'bandeau', text: 'Version définitive rédigée par Claude. Relisez-la ici : vos corrections se font ensuite dans le Word, avec le suivi des modifications.' }));
    md = typeof o.contenu_md === 'string' && o.contenu_md.trim() ? o.contenu_md : '';
    pts = saisieValide(o) && o.saisie.type === 'points_decision' && Array.isArray(o.saisie.points) && o.saisie.points.length ? o.saisie.points : null;
    avecLecture = !!(md || pts);
    if (saisieValide(o)) saisie = construireSaisie(o);

      p.appendChild(h('button', { type: 'button', class: 'vers-saisie', text: 'Aller à la saisie', onclick: function () { saisie.querySelector('h3').focus(); } }));
    }
    if (avecLecture) {
      lecture = h('section', { 'aria-label': 'En détail' }, [h('p', { class: 'etiquette', text: 'En détail' })]);
      var zone = h('div', { class: 'md' });
      if (md) rendreMarkdown(md, zone);
      if (pts) zone.appendChild(syntheseDecision(pts));
      lecture.appendChild(zone);
      p.appendChild(lecture);
    }
    if (saisie) {
      if (avecLecture) p.appendChild(h('hr', { class: 'separateur' }));
      p.appendChild(saisie);
      majAvertStockage();
    }
    try { titre.scrollIntoView({ block: 'start' }); } catch (e) { /* ignoré */ }
  }

  /* ---------- démarrage ---------- */
  function illisible() {
    $('#mg-panneau').appendChild(h('p', { class: 'illisible', role: 'alert', text: 'Données illisibles : demandez à Claude de republier l’artefact.' }));
  }
  async function demarrer() {
    var brut, choix;
    try {
      brut = JSON.parse($('#mg-donnees').textContent);

    } catch (e) { illisible(); return; }
    try {
      var dos = D.dossier || {};

      if (dos.rg) $('#mg-dossier').appendChild(h('span', { class: 'rg', text: 'RG ' + dos.rg }));
      if (D.demo === true) $('#mg-bandeau').appendChild(h('p', { class: 'bandeau', role: 'note', text: 'Données de démonstration : l’envoi est désactivé.' }));
      sonderStockage();
      initMarkdown();
      visibles = D.onglets.filter(function (o) {
        return o && typeof o === 'object' && o.id && ((typeof o.contenu_md === 'string' && o.contenu_md.trim()) || saisieValide(o));
      });
      if (!visibles.length) { illisible(); return; }
      try {
        if (window.claude && typeof window.claude.use === 'function') room = await window.claude.use('room');
      } catch (e) { room = null; }
      statutRoom = await verifierStatut();

    } catch (e) { illisible(); }
  }
  demarrer();
})();
